<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Client -->
  <rect x="260" y="20" width="400" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="460" y="42" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">React SPA (Vite + TypeScript)</text>
  <text x="460" y="62" text-anchor="middle" font-size="12" fill="#334155">Workspace · Ask Bot · Moderation · Settings</text>

  <line x1="460" y1="76" x2="460" y2="98" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- API -->
  <rect x="160" y="100" width="600" height="72" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="460" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Spring Boot API</text>
  <rect x="190" y="134" width="150" height="28" rx="6" fill="#fff" stroke="#94a3b8"/>
  <text x="265" y="153" text-anchor="middle" font-size="11" fill="#334155">REST + JWT</text>
  <rect x="385" y="134" width="150" height="28" rx="6" fill="#fff" stroke="#94a3b8"/>
  <text x="460" y="153" text-anchor="middle" font-size="11" fill="#334155">WebSocket (STOMP)</text>
  <rect x="580" y="134" width="150" height="28" rx="6" fill="#fff" stroke="#94a3b8"/>
  <text x="655" y="153" text-anchor="middle" font-size="11" fill="#334155">Ask Bot SSE</text>

  <line x1="460" y1="172" x2="460" y2="194" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- AI layer -->
  <rect x="120" y="196" width="680" height="88" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <text x="460" y="218" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">AI layer  LangGraph4j + LangChain4j</text>
  <rect x="150" y="230" width="280" height="40" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="290" y="248" text-anchor="middle" font-size="11" font-weight="600" fill="#78350f">Role-based routing</text>
  <text x="290" y="262" text-anchor="middle" font-size="10" fill="#78350f">Member · Moderator · Channel · Public</text>
  <text x="460" y="252" text-anchor="middle" font-size="18" fill="#d97706">’</text>
  <rect x="490" y="230" width="280" height="40" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="630" y="248" text-anchor="middle" font-size="11" font-weight="600" fill="#78350f">Tool-calling agent (ReAct loop)</text>
  <text x="630" y="262" text-anchor="middle" font-size="10" fill="#78350f">FAQ · memory · search · summarize · moderation</text>

  <line x1="360" y1="284" x2="360" y2="310" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="284" x2="560" y2="310" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Data -->
  <rect x="80" y="312" width="560" height="72" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="360" y="334" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Data &amp; infrastructure</text>
  <rect x="110" y="346" width="150" height="28" rx="6" fill="#fff" stroke="#94a3b8"/>
  <text x="185" y="365" text-anchor="middle" font-size="11" fill="#334155">PostgreSQL + vectors</text>
  <rect x="285" y="346" width="150" height="28" rx="6" fill="#fff" stroke="#94a3b8"/>
  <text x="360" y="365" text-anchor="middle" font-size="11" fill="#334155">Redis pub/sub + memory</text>
  <rect x="460" y="346" width="150" height="28" rx="6" fill="#fff" stroke="#94a3b8"/>
  <text x="535" y="365" text-anchor="middle" font-size="11" fill="#334155">Object store (files)</text>

  <!-- External AI -->
  <rect x="680" y="312" width="200" height="72" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="3"/>
  <text x="780" y="342" text-anchor="middle" font-size="13" font-weight="700" fill="#831843">OpenAI</text>
  <text x="780" y="362" text-anchor="middle" font-size="10" fill="#831843">chat · embeddings</text>
  <text x="780" y="376" text-anchor="middle" font-size="10" fill="#831843">moderation API</text>

  <line x1="630" y1="252" x2="680" y2="340" stroke="#db2777" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="80" y="420" width="18" height="18" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="106" y="434" font-size="12" fill="#334155">AI orchestration (amber)</text>
  <rect x="320" y="420" width="18" height="18" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="346" y="434" font-size="12" fill="#334155">External AI models (pink)</text>
  <text x="80" y="468" font-size="12" fill="#64748b">Flow: User ’ SSE / REST ’ role routing ’ tool loop ’ citations &amp; timeline in UI</text>
  <text x="80" y="490" font-size="12" fill="#64748b">Real-time chat: WebSocket ’ Redis fan-out ’ all connected clients</text>
</svg>
