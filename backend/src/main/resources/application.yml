spring:
  application:
    name: community-bot

  datasource:
    url:      ${DB_URL:jdbc:postgresql://localhost:5432/communitybot}
    username: ${DB_USERNAME:communitybot}
    password: ${DB_PASSWORD:communitybot}
    hikari:
      maximum-pool-size: 10
      minimum-idle:       2

  jpa:
    hibernate:
      ddl-auto: validate        # Flyway owns the schema; Hibernate only validates
    show-sql: false
    open-in-view: false         # prevents lazy-loading leaks in controllers
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id:     ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: [openid, email, profile]
          github:
            client-id:     ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: [read:user, user:email]
        provider:
          github:
            # GitHub doesn't use the standard userinfo URI
            user-info-uri:       https://api.github.com/user
            user-name-attribute: login

  data:
    redis:
      host:     ${REDIS_HOST:localhost}
      port:     ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  servlet:
    multipart:
      max-file-size:    10MB
      max-request-size: 11MB

# ─── App-level config ────────────────────────────────────────────────────────
app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  jwt:
    secret:                  ${JWT_SECRET}
    access-token-expiry-ms:  900000       # 15 minutes
    refresh-token-expiry-ms: 604800000    # 7 days
  minio:
    endpoint:   ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket:     ${MINIO_BUCKET:community-bot}
  clamav:
    host:            ${CLAMAV_HOST:localhost}
    port:            ${CLAMAV_PORT:3310}
    timeout-seconds: 30
    enabled:         ${CLAMAV_ENABLED:true}
  upload:
    max-size-bytes: 10485760   # 10 MB
  openai:
    api-key:         ${OPENAI_API_KEY}
    embedding-model: text-embedding-3-small
    chat-model:      gpt-4o-mini
    max-tokens:      512
    temperature:     0.7
    daily-rag-limit: 100       # max RAG calls per workspace per calendar day
    model-rates:
      fallback:
        input-per-million: 0.15
        output-per-million: 0.60
      gpt-4o-mini:
        input-per-million: 0.15
        output-per-million: 0.60
      text-embedding-3-small:
        input-per-million: 0.02
        output-per-million: 0
  agent:
    max-sequential-tools: 8
    max-sequential-tools-constrained: 4
    short-term-memory-max-messages: 24
    redis-memory-ttl-hours: 168
    long-term-memory-top-k: 3
    daily-workspace-limit: 500
    tavily-api-key: ${TAVILY_API_KEY:}
    web-search-admin-only: true
  moderation:
    classification-enabled: ${MODERATION_ENABLED:true}
    confidence-threshold:   0.7
    openai-moderation-enabled: true
    guidelines-check-enabled:  true
    hide-on-flag:              true
    openai-moderation-model:   omni-moderation-latest
  thread-summary:
    enabled:       true
    min-messages:  10   # Otter-style digest when root + replies reach this count
  n8n:
    enabled:         true
    api-key:         ${N8N_API_KEY:change-me-in-production}
    default-period-days: 7
    max-messages-per-channel: 40
  scheduling:
    poll-interval-ms: 60000
  welcome:
    enabled: true
    personalization-enabled: true
    default-template: "👋 Welcome to the community, {name}! We're glad you're here. Introduce yourself in #general and explore the channels."
  joypixels:
    enabled: true
    emoji-json-url: https://cdn.jsdelivr.net/npm/emoji-toolkit@9.0.0/emoji.json
    cdn-base: https://cdn.jsdelivr.net/npm/emoji-toolkit@9.0.0
    png-size: 64
    ai-search-enabled: true
    default-limit: 24
    api-key: ${JOYPIXELS_API_KEY:}

# ─── Server ───────────────────────────────────────────────────────────────────
server:
  port: 8080
  error:
    include-message: always   # include error message in JSON response (remove in strict prod)

# ─── Actuator ─────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info, agents
  endpoint:
    health:
      show-details: when-authorized

# ─── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    com.communitybot:                INFO
    org.springframework.security:    WARN
    org.springframework.web:         WARN
