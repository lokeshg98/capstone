[versions]
springBoot                = "3.5.13"
springDependencyManagement = "1.1.7"
jjwt                      = "0.12.6"
lombok                    = "1.18.46"
testcontainers            = "1.20.4"
minio                     = "8.5.11"
tika                      = "2.9.2"
pdfbox                    = "3.0.3"
poi                       = "5.3.0"
langchain4j-bom           = "1.15.0"

[libraries]
spring-boot-starter-web          = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-data-jpa     = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-security     = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-oauth2-client = { module = "org.springframework.boot:spring-boot-starter-oauth2-client" }
spring-boot-starter-validation   = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-data-redis   = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
spring-boot-starter-websocket    = { module = "org.springframework.boot:spring-boot-starter-websocket" }
spring-boot-starter-actuator     = { module = "org.springframework.boot:spring-boot-starter-actuator" }
flyway-core                      = { module = "org.flywaydb:flyway-core" }
flyway-postgresql                = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql                       = { module = "org.postgresql:postgresql" }
jjwt-api                         = { module = "io.jsonwebtoken:jjwt-api",     version.ref = "jjwt" }
jjwt-impl                        = { module = "io.jsonwebtoken:jjwt-impl",    version.ref = "jjwt" }
jjwt-jackson                     = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jjwt" }
lombok                           = { module = "org.projectlombok:lombok",     version.ref = "lombok" }
spring-boot-starter-test         = { module = "org.springframework.boot:spring-boot-starter-test" }
testcontainers-junit5            = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
testcontainers-postgresql        = { module = "org.testcontainers:postgresql",    version.ref = "testcontainers" }
minio                            = { module = "io.minio:minio",                   version.ref = "minio" }
tika-core                        = { module = "org.apache.tika:tika-core",        version.ref = "tika" }
pdfbox                           = { module = "org.apache.pdfbox:pdfbox",         version.ref = "pdfbox" }
poi-ooxml                        = { module = "org.apache.poi:poi-ooxml",         version.ref = "poi" }
langchain4j-bom                  = { module = "dev.langchain4j:langchain4j-bom",    version.ref = "langchain4j-bom" }
langchain4j                      = { module = "dev.langchain4j:langchain4j" }
langchain4j-open-ai             = { module = "dev.langchain4j:langchain4j-open-ai" }
langchain4j-web-search-tavily   = { module = "dev.langchain4j:langchain4j-web-search-engine-tavily" }

[plugins]
spring-boot                  = { id = "org.springframework.boot",          version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management",  version.ref = "springDependencyManagement" }
